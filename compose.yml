services:
  mysql:
    image: mysql:8.4
    container_name: novelscout-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: novelscout
      MYSQL_USER: novelscout
      MYSQL_PASSWORD: novelscout
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - novelscout_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  novelscout_mysql_data:

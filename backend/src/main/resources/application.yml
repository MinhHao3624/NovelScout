spring:
  application:
    name: novelscout
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/novelscout?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:novelscout}
    password: ${DB_PASSWORD:novelscout}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  cache:
    type: caffeine

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  crawler:
    enabled: ${CRAWLER_ENABLED:false}
    default-delay-ms: ${CRAWLER_DEFAULT_DELAY_MS:1500}
  recommendation:
    content-weight: ${RECOMMENDATION_CONTENT_WEIGHT:0.45}
    collaborative-weight: ${RECOMMENDATION_COLLABORATIVE_WEIGHT:0.45}
    popularity-weight: ${RECOMMENDATION_POPULARITY_WEIGHT:0.10}
